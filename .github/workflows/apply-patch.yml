name: apply-patch

on:
  push:
    branches:
      - bp-2026-10-31b
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run patch
        run: python3 __bp_patch2.py
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frigate_review_notification.yaml README.md
          git commit -m "docs(blueprint): 2026-10-31 summary cap + title timestamp"
          git rm -q __bp_patch2.py .github/workflows/apply-patch.yml
          git commit -m "ci: remove patch scaffolding"
          git push
