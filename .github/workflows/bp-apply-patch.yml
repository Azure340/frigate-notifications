name: bp-apply-patch
on:
  push:
    branches: [bp-2026-10-31]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bp-2026-10-31
      - name: Apply verified patch
        run: |
          set -euo pipefail
          python3 __bp_patch.py
      - name: Commit blueprint and remove CI scaffolding
        run: |
          set -euo pipefail
          git config user.name "Azure340"
          git config user.email "230386615+Azure340@users.noreply.github.com"
          git rm -q __bp_patch.py .github/workflows/bp-apply-patch.yml
          git add frigate_review_notification.yaml
          git commit -m "2026-10-31: cap AI summary length, prefix titles with review start time"
          git push origin HEAD:bp-2026-10-31
